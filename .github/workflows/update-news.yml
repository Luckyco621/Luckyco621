name: AI4S ニュース自動更新

on:
  schedule:
    # 毎日 00:00 UTC (09:00 JST) に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 手動実行も可能

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: AI4S ニュースデータを取得
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/fetch_news.py

      - name: 変更をコミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_data.json data/dates_index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: AI4Sニュース自動更新 $(date -u '+%Y-%m-%d')"
            git push
          fi
